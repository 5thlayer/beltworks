// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing and the release and upload tasks come from the libworks convention plugin (libworks ADR 0003).
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.0'
}

// What the Mod requires of the other Modules, each as a range whose lower bound is a released version:
// the one the Mod is built and run against and the one CI builds from its tag. neoforge.mods.toml names
// each as ${<name>_range}. Beltworks' own tags are the default, beltworks-v<version>.
libworks {
    // Required at load and not bundled (ADR 0015). The lower bound rises with the Groundworks the Mod
    // builds against; the cap is the next minor, which moves when the Mod takes it.
    upstream('groundworks') {
        // Groundworks' tags are v<version>.
        tagPrefix = 'v'
        range = '[0.5.8,0.6)'
    }
    // Nested, unlike Groundworks: the shared Works tab needs it loaded as a mod (FactoryWorks ADR-0128).
    runtime = '0.1.9'
}

repositories {
    maven { url = 'https://cursemaven.com' }
    exclusiveContent { // Energized Power, the dev client's FE source
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent { // JEI
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
}

neoForge {
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
}

// Mods the dev client loads alongside the Mod, to check its integrations by hand. 26.1 has no
// per-run classpath, so they go into the client's mods folder, which holds only what is listed here.
configurations {
    clientMods { transitive = false }
}

def syncClientMods = tasks.register('syncClientMods', Sync) {
    from configurations.clientMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') { dependsOn syncClientMods }

// The last JEI for 26.1.2 that loads on gradle.properties' neoforge_version; later ones need 26.1.2.81 or more.
def jeiVersion = '29.20.0.53'

dependencies {
    clientMods 'curse.maven:jade-324717:8651070'
    // Its Creative Battery Box powers feeders and loaders with loadersNeedPower on (5thlayer/beltworks#80).
    clientMods 'maven.modrinth:energized-power:3.0.1+26.1.x-neoforge'
    clientMods "mezz.jei:jei-26.1.2-neoforge:$jeiVersion"

    compileOnly 'curse.maven:ftb-filter-system-943925:8300190'
    // Jade finds the tile's tooltip plugin by its annotation, so the Mod runs without it.
    compileOnly 'curse.maven:jade-324717:8651070'
    // JEI finds the splitter screen's drop target by its annotation, so the Mod runs without it.
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:$jeiVersion"
}
