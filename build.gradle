plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = maven_group
version = mod_version
// Still the jar name the Pack's globs look for; the rename gives it the Mod's own.
base.archivesName = "$archives_name-neoforge"

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    maven { url = 'https://cursemaven.com' }
    maven { // EMI
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

def gameTestReport = layout.buildDirectory.file('reports/gametest.xml').get().asFile

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Runs the Mod's game tests headless and exits, non-zero if any fails. 26.1 has no
        // namespace property, so the selector is what keeps vanilla's tests out.
        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll '--tests', "${mod_id}:*", '--report', gameTestReport.absolutePath
        }
    }

    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
}

// The server says only how many tests passed, so the report is read back to name them: a green
// run that didn't run a test is no evidence for it.
tasks.named('runGameTestServer') {
    doFirst { gameTestReport.delete() }
    doLast {
        if (!gameTestReport.exists()) throw new GradleException("The game test server wrote no report at $gameTestReport")
        def cases = new groovy.xml.XmlSlurper().parse(gameTestReport).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The game test server ran no tests')
        cases.each { logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
    }
}

dependencies {
    compileOnly 'curse.maven:ftb-filter-system-943925:8300190'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
