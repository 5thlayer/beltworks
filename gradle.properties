# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Mod's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too.
mod_id = beltworks
mod_name = Beltworks
mod_description = Factorio-style belts laid on the block grid, which work with any tech mod.
mod_version = 0.3.12
maven_group = io.github.5thlayer
archives_name = beltworks

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77

# Modrinth and CurseForge (docs/agents/releases.md). The dependencies are the required ones, comma
# separated: Modrinth project ids, CurseForge slugs. Beltworks has none: Groundworks is nested.
# upload_release_type is release, beta or alpha for every upload, or empty for beta below 1.0 and
# release from it; CurseForge's app lists a project only once it has a release.
modrinth_project_id = p4zxipln
curseforge_project_id = 1714527
modrinth_dependencies =
curseforge_dependencies =
upload_release_type = release
