version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one, and the last annotation matching a file wins, so the
# general rules come first and the Upstream-lineage exceptions after them.
# Lineage is read against the fork point, the `26.1.2` branch (92a97c3):
# see NOTICE.

# The Mod's own build files, scripts and docs.
[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    "**/*.mods.toml",
    "**/*.mixins.json",
    "scripts/*.py",
    "scripts/*.sh",
    "**/*.md",
    "NOTICE",
    "publish/summary.txt",
    ".github/**",
    ".claude/settings.json",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# Build files and docs that still carry Upstream's lines (ADR 0001).
[[annotations]]
path = [
    "build.gradle",
    "settings.gradle",
    "gradle.properties",
    ".gitignore",
    "src/main/resources/META-INF/neoforge.mods.toml",
    "src/main/resources/beltworks.mixins.json",
    "CHANGELOG.md",
]
SPDX-FileCopyrightText = ["Rearth", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0 AND MIT"

# Every asset is CC BY 4.0, whatever its origin (ADR 0001). This covers the
# art the fork drew from scratch: the loader's band, loader_slate,
# loader_mouth, belt_underside, belt_tile_side and belt_slope_side.
[[annotations]]
path = [
    "src/main/resources/assets/**",
    "src/main/resources/data/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "CC-BY-4.0"

# Assets that still carry Upstream's lines.
[[annotations]]
path = [
    "src/main/resources/assets/beltworks/blockstates/loader.json",
    "src/main/resources/assets/beltworks/models/block/loader.json",
    "src/main/resources/assets/beltworks/lang/en_us.json",
    "src/main/resources/assets/beltworks/items/loader.json",
    "src/main/resources/assets/beltworks/models/item/loader.json",
    "src/main/resources/data/beltworks/loot_table/blocks/loader.json",
    # Git reads these as copies of Upstream's files, though they hold only
    # Minecraft's boilerplate. Crediting Rearth errs on the safe side.
    "src/main/resources/assets/beltworks/blockstates/belt_tile.json",
    "src/main/resources/assets/beltworks/blockstates/belt_wedge.json",
    "src/main/resources/assets/beltworks/items/*.json",
    "src/main/resources/data/beltworks/loot_table/blocks/*.json",
]
SPDX-FileCopyrightText = ["Rearth", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The belt surface: every tier's frames, corners and splitter strips, and
# their source art. Re-authored from Upstream's, which came from
# malcolmriley's unused-textures.
[[annotations]]
path = [
    "src/main/resources/assets/beltworks/textures/block/*conveyorbelt/**",
    "src/main/resources/assets/beltworks/textures/block/*belt_corner_*",
    "src/main/resources/assets/beltworks/textures/block/*splitter_belt.png*",
    "scripts/belt-art/**",
]
SPDX-FileCopyrightText = ["Rearth", "malcolmriley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Temporary cover and icon for mod pages. Their backdrop is the belt art.
[[annotations]]
path = ["publish/*.png"]
SPDX-FileCopyrightText = ["Rearth", "malcolmriley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"
